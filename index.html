<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Adega do Hambúrguer | Fascínio por Hambúrgueres e Vinhos</title>
  <meta name="description" content="Hambúrguer artesanal com alma. Ingredientes selecionados, paixão e harmonização com vinhos.">
  
  <!-- Fontes -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Raleway:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    :root {
      --primary: #c41e3a;
      --accent: #d4af37;
      --wood: #8B4513;
      --fire: #ff4500;
      --dark: #0f0f0f;
      --text: #f5f5f5;
      --text-muted: #cccccc;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Raleway', sans-serif;
      line-height: 1.8;
      color: var(--text);
      background: var(--dark);
      background-image: 
        radial-gradient(circle at 10% 90%, rgba(139,69,19,0.2) 0%, transparent 50%),
        radial-gradient(circle at 90% 10%, rgba(139,69,19,0.15) 0%, transparent 50%);
      overflow-x: hidden;
    }

    .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

    /* Navbar */
    .navbar {
      position: fixed; top: 0; width: 100%;
      background: rgba(15,15,15,0.98);
      backdrop-filter: blur(12px);
      z-index: 1000;
      border-bottom: 3px solid var(--wood);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .nav-container {
      display: flex; justify-content: space-between; align-items: center; padding: 1rem 0;
    }
    .logo-img { height: 55px; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6)); }
    .nav-menu { display: flex; list-style: none; gap: 2.2rem; }
    .nav-menu a {
      color: var(--text); text-decoration: none; font-weight: 600; font-size: 1.1rem;
      position: relative; transition: color 0.3s;
    }
    .nav-menu a::after {
      content: ''; position: absolute; bottom: -6px; left: 0; width: 0; height: 2px;
      background: var(--accent); transition: width 0.3s;
    }
    .nav-menu a:hover { color: var(--accent); }
    .nav-menu a:hover::after { width: 100%; }

    .hamburger { display: none; flex-direction: column; gap: 6px; cursor: pointer; }
    .hamburger span { width: 30px; height: 3px; background: var(--accent); border-radius: 2px; }

    /* Hero */
    .hero {
      min-height: 100vh;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; padding-top: 100px; position: relative;
      background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.9)),
                  url('https://images.unsplash.com/photo-1607013251379-e5eecffdee28?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80') center/cover;
      background-attachment: fixed;
    }
    .hero::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(transparent 60%, var(--dark) 100%);
    }
    .hero-logo {
      width: 380px; max-width: 90%; margin-bottom: 1.5rem;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.7));
    }
    .hero h1 {
      font-family: 'Playfair Display', serif; font-size: 2.8rem; color: var(--accent);
      margin-bottom: 0.5rem; letter-spacing: 1px;
    }
    .hero p {
      font-size: 1.3rem; color: var(--text-muted); max-width: 700px; margin: 0 auto 2rem;
    }
    .btn {
      display: inline-block; padding: 16px 40px; border-radius: 8px; font-weight: 700;
      text-decoration: none; transition: all 0.4s; margin: 0 12px; font-size: 1.1rem;
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    }
    .btn-primary {
      background: var(--primary); color: white; border: 2px solid var(--primary);
    }
    .btn-primary:hover {
      background: #a0172e; transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(196,30,58,0.5);
    }
    .btn-secondary {
      background: transparent; color: var(--accent); border: 2px solid var(--accent);
    }
    .btn-secondary:hover {
      background: var(--accent); color: var(--dark); transform: translateY(-4px);
    }

    /* Seções */
    .section { padding: 130px 0; opacity: 0; transform: translateY(50px); transition: all 1s ease-out; }
    .section.visible { opacity: 1; transform: translateY(0); }
    h2 {
      font-family: 'Playfair Display', serif; font-size: 3rem; color: var(--accent);
      text-align: center; margin-bottom: 2rem; position: relative;
    }
    h2::after {
      content: ''; position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%);
      width: 100px; height: 5px; background: var(--wood); border-radius: 3px;
    }

    /* WhatsApp */
    .whatsapp-btn {
      position: fixed; bottom: 30px; right: 30px; background: #25D366; color: white;
      width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-size: 2.2rem; box-shadow: 0 10px 30px rgba(37,211,102,0.6);
      z-index: 999; animation: pulse 2s infinite; border: 4px solid white;
      text-decoration: none;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(37,211,102,0.7); }
      70% { box-shadow: 0 0 0 22px rgba(37,211,102,0); }
      100% { box-shadow: 0 0 0 0 rgba(37,211,102,0); }
    }

    /* Responsivo */
    @media (max-width: 768px) {
      .hamburger { display: flex; }
      .nav-menu { position: fixed; top: 70px; left: -100%; width: 100%; background: #0a0a0a;
        flex-direction: column; padding: 2.5rem 0; transition: 0.4s; border-bottom: 3px solid var(--wood); }
      .nav-menu.active { left: 0; }
      .hero h1 { font-size: 2.3rem; }
      .hero-logo { width: 300px; }
      .btn { display: block; margin: 15px auto; max-width: 280px; }
      h2 { font-size: 2.4rem; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container nav-container">
      <img src="logo.png" alt="Adega do Hambúrguer" class="logo-img">
      <ul class="nav-menu">
        <li><a href="#home">Início</a></li>
        <li><a href="#menu">Cardápio</a></li>
        <li><a href="#sobre">Sobre</a></li>
        <li><a href="#contato">Contato</a></li>
      </ul>
      <div class="hamburger" onclick="document.querySelector('.nav-menu').classList.toggle('active')">
        <span></span><span></span><span></span>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero" id="home">
    <img src="logo.png" alt="Adega do Hambúrguer" class="hero-logo">
    <h1>Fascínio por Hambúrgueres e Vinhos</h1>
    <p>Hambúrguer artesanal com alma. Ingredientes selecionados, paixão e harmonização com vinhos.</p>
    <a href="#menu" class="btn btn-primary">Ver Cardápio</a>
    <a href="https://wa.me/554195433974" class="btn btn-secondary">Fazer Pedido</a>
  </section>

  <!-- WhatsApp Flutuante -->
  <a href="https://wa.me/554195433974" class="whatsapp-btn" target="_blank">
    <i class="fab fa-whatsapp"></i>
  </a>

  <script>
    // Animação ao rolar
    const sections = document.querySelectorAll('.section');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.1 });
    sections.forEach(section => observer.observe(section));
  </script>
</body>
</html>
